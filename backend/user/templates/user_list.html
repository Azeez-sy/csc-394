<!DOCTYPE html>
<html lang="en">
<head>
<style>
    .fb { padding: 20px; height: 30px; font-family: Arial, Helvetica, sans-serif;}
    .tb { border-collapse: collapse; width:300px; text-transform: uppercase; font-family: Arial, Helvetica, sans-serif;}
    .tb th, .tb td { padding: 5px; border: solid 1px #777; }
    .tb th { background-color: lightblue; }
</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/user-list" method="post" class="fb">
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required>
        <label for="first_name">First name:</label>
        <input type="text" id="first_name" name="first_name" required>
        <label for="last_name">Last name:</label>
        <input type="text" id="last_name" name="last_name" required>
        <label for="role">Role:</label>
        <select id="role" name="role" required>
            <option value="volunteer">Volunteer</option>
            <option value="tutor">Tutor</option>
            <option value="counselor">Counselor</option>
            <option value="admin">Admin</option>
        </select>
        <input type="submit" value="Submit">
    </form>
    <table class="tb">
        <tr>
            <th>Email</th>
            <th>First Name</th>
            <th>Last Name</th> 
            <th>Role</th>
        </tr>
            {% for user in data %}
        <tr>
            <td>{{user.email}}</td>
            <td>{{user.first_name}}</td>
            <td>{{user.last_name}}</td>
            <td>{{user.role}}</td>
        </tr>
            {% endfor %}
        </table>        
</body>
</html>
